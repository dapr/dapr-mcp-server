name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  server-json:
    name: Validate server.json
    runs-on: ubuntu-latest
    env:
      CHECK_JSONSCHEMA_VERSION: 0.38.2
      # Bump together with "$schema" in server.json.
      SERVER_JSON_SCHEMA: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate against the MCP Registry schema
        run: |
          schema=$(jq -er '."$schema"' server.json)
          if [[ "$schema" != "$SERVER_JSON_SCHEMA" ]]; then
            echo "::error file=server.json::server.json names schema '$schema', but CI expects '$SERVER_JSON_SCHEMA'. Update both together."
            exit 1
          fi
          pipx run --spec "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}" check-jsonschema --schemafile "$SERVER_JSON_SCHEMA" server.json

      - name: Check name matches the Dockerfile label
        run: |
          name=$(jq -er .name server.json)
          label=$(sed -nE 's/^LABEL io\.modelcontextprotocol\.server\.name="([^"]+)"$/\1/p' Dockerfile)
          if [[ "$name" != "$label" ]]; then
            echo "::error file=server.json::server.json name '$name' does not match the Dockerfile io.modelcontextprotocol.server.name label '$label'."
            exit 1
          fi
          echo "server.json name and Dockerfile label match: $name"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${{ github.sha }}" \
            -o dapr-mcp-server-linux-amd64 \
            ./cmd/dapr-mcp-server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dapr-mcp-server-linux-amd64
          path: dapr-mcp-server-linux-amd64
          retention-days: 7
